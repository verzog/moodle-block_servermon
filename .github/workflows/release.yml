name: Release zip

# Publishing a GitHub release builds the installable plugin zip and attaches it. Run it by hand with an existing
# tag to rebuild the zip for that release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rebuild the zip for (e.g. v2.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    uses: verzog/moodle-ci-workflows/.github/workflows/release-zip.yml@vdiddy/more-inputs
    with:
      tag: ${{ inputs.tag }}
